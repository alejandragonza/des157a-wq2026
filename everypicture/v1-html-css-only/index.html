<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Sigmar+One&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>

    <style>

body {

    color: rgb(8, 67, 125);
    text-align: center;
    background-color: rgb(222, 167, 65);

    display: flex;
    flex-direction: column;
    min-height: 100vh;
}
.pageContent {
    flex: 2;
}

#container {
    width: 800px;
    height: 547px;
    overflow: hidden;
    position: relative;
    margin: auto;
    border-radius: 20px;
}

#container div {
    position: absolute;
    width: 150px;
    height: 150px;
    
}

#container img {
    display: block;
    position: absolute;
    border-radius: 20px;
}

#topleft {
    top: 0;
    left: 0;
   
}
#overlayText {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background:rgb(8, 67, 125);
    color: rgb(222, 167, 65) ;
    padding: 10px;
    opacity: 0;
    border-radius: 20px;
    transition: opacity 0.5s ease; 
    line-height: 1.6em;

    display: inline-block;
    min-width: 250px;
    text-align: left;
}

#buttonContainer {
    position: absolute;
    /* bottom: 10px;      */
    width: 100%;
    margin: 20px 0;
    text-align: center; 
    /* z-index: 10; 
    padding-top: 10px;       */
}

#buttonContainer button {
    margin: 0 5px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: rgb(8, 67, 125);
    color: rgb(222, 167, 65);
    font-size: 14px;
    margin-bottom: 10px;
}

#previous {
    left: 40px; 
    bottom: 15px;
}

#next {
    right: 20px;
    bottom: 15px;
}

#previous, #next {
    font-size: 14px;   
    padding:  20px; 
    font-family: "Montserrat";
    /* position: absolute; */
}

.start {
    width: 800px;
    left: 0;
    top: 0;
}
#caption {
    width: 800px;
    margin: 10px auto 0 auto; /* centered below the image */
    text-align: center;
    font-size: 16px;
    color: rgb(8, 67, 125);
    line-height: 1.4em;
}

h1{
    font-family: "Sigmar One";
}
p {
    font-family: "Montserrat";
}

footer{
    background-color:rgb(8, 67, 125);
    padding: 20px 0;
    margin-top: auto;
}

footer p {
    color:  rgb(222, 167, 65); 
    margin: 0;
}

    </style>
    
   
</head>
<body>
    <div class="pageContent">
    <h1> The aesthetics of everyday </h1>

    <div id="container">
        <img id="myimage" src="v1-images/sketch2.jpg" alt="original sketch pic" class="start">

    </div>
    <p> everyday objects and their translation</p>

    <div id="buttonContainer">

        <button id="previous">previous</button> <button id="next">next</button>
        
    </div>
    
</div>
    
   <footer>
    <p>made by alejandra</p>
   </footer>
</body>
</html>
